[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "darkflipper"
dynamic = ["version"]
description = "Dark Energy Figure of Merit and Figure of Bias for Likelihood Pipelines"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Guadalupe Cañas Herrera", email = "canasherrera@strw.leidenuniv.nl" }
]
keywords = ["dark energy", "cosmology", "Euclid", "Bayesian inference"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
requires-python = ">=3.10"

dependencies = [
    "scipy",
    "numpy",
    "getdist",
    "shapely",
    "matplotlib>=3.6",
    "contourpy"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pre-commit"]

[project.urls]
Homepage = "https://github.com/cloe-org/darkflipper"
Issues = "https://github.com/cloe-org/darkflipper/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "darkflipper/_version.py"

[tool.pytest.ini_options]
addopts = "--verbose --cov=darkflipper"

[tool.hatch.metadata]
allow-direct-references = true
